---
- name: Install httpd service
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Start and enable httpd and firewalld
  ansible.builtin.service:
    name: "{{ item.name }}"
    state: started
    enabled: true
  loop: "{{ services }}"

- name: Ensure firewall allows access to webserver
  ansible.posix.firewalld:
    service: http
    state: enabled
    permanent: true  
    immediate: true

- name: Use template to generate /var/www/html/index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html 
